<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MainStreet RP</title>
  <link rel="stylesheet" href="style.css">
  <script src="config.js"></script>
</head>
<body>
  <canvas id="city" aria-hidden="true"></canvas>
  <div class="shade" aria-hidden="true"></div>

  <header class="top">
    <div class="conn"><span class="pulse"></span><span id="connText">Connecting to MainStreet RP</span><span class="clock" id="clock">00:00</span></div>
    <button class="music" id="musicBtn" type="button" aria-pressed="true">
      <span class="bars" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
      <span id="musicLabel">Music on</span><kbd>M</kbd>
    </button>
  </header>

  <main class="panel">
    <div class="brand">
      <img id="logoImg" alt="" hidden>
      <h1 class="wordmark" id="wordmark"><span id="wmName">MainStreet</span><b id="wmTag">RP</b></h1>
    </div>

    <section class="load" aria-live="polite">
      <div class="row">
        <span class="stage" id="stage">Connecting</span>
        <span class="pct"><span id="pct">0</span><small>%</small></span>
      </div>
      <div class="road" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="road">
        <div class="fill" id="fill"><span class="head"></span></div>
      </div>
    </section>

    <section class="tip">
      <div class="tipHead"><span>Street tip</span><span class="num" id="tipNum">01 / 07</span></div>
      <p id="tipText"></p>
    </section>
  </main>

  <footer class="log"><span id="logLine"></span></footer>

  <audio id="theme" loop preload="auto"></audio>
  <script src="app.js"></script>
</body>
</html>
